name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量 git 历史:首页卡片"最后更新日期"取自 git 时间,
          # fetch-depth 1 会让 CI 里全部变为构建日
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 站内链接完整性校验(新增/移动页面时防死链回归)
      - run: npm run check:links
      # 全站内容转储(llms-full.txt)随构建重新生成,保证 AI 引擎读到最新内容
      - run: npm run gen:llms
      - run: npm run docs:build
      # VitePress 1.4 构建不会自动生成 .nojekyll,必须显式创建,
      # 否则 GitHub Pages 的 Jekyll 处理会吞掉 _ 前缀/无扩展文件
      - run: touch docs/.vitepress/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
